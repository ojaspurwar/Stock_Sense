<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m7.5 4.27 9 5.15'/><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSense | Modern Modular Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured Global Error:', e);
        var d = document.getElementById('debug-error-overlay');
        if (!d) {
          d = document.createElement('div');
          d.id = 'debug-error-overlay';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#991b1b;color:#fff;padding:24px;z-index:9999999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
          document.body.appendChild(d);
        }
        d.innerHTML += '<strong>[Global Error]</strong> ' + e.message + '\n' + (e.error ? e.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Captured Promise Rejection:', e);
        var d = document.getElementById('debug-error-overlay');
        if (!d) {
          d = document.createElement('div');
          d.id = 'debug-error-overlay';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#991b1b;color:#fff;padding:24px;z-index:9999999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
          document.body.appendChild(d);
        }
        d.innerHTML += '<strong>[Promise Rejection]</strong> ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e) + '\n\n';
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
